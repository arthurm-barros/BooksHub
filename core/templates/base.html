<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>

    <nav>
        <ul>
            {% if usuario %}
                <li><a href="{{ url_for('livros.listar') }}">Livros</a></li>
                <li><a href="{{ url_for('categorias.listar') }}">Categorias</a></li>
            {% else %}
                <li><a href="{{ url_for('index') }}">Início</a></li>
                <li><a href="{{ url_for('login') }}">LivroLogin</a></li>
                <li><a href="{{ url_for('cadastro') }}">Cadastrar-se</a></li>
            {% endif %}
        </ul>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
