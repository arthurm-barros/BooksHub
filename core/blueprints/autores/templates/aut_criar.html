{% extends 'base.html' %}
{% block title %} Adicionar Autor {% endblock %}

{% block content %}
<h1>Cadastrar Novo Autor</h1>

<form action="{{ url_for('autores.criar') }}" method="POST">
    <div>
        <label for="nome">Nome do Autor:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do autor" required>
    </div>

    <hr>

    <button type="submit">Cadastrar Autor</button>
    <a href="{{ url_for('autores.listar') }}">Cancelar</a>
</form>
{% endblock %}x
